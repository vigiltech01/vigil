    <button class="av" id="av" title="Account">·</button>

</aside>

  <a href="#welcome"><svg viewBox="0 0 24 24"><path d="M4 12h16M12 4v16"/></svg>Connect a FortiGate</a>
  <a href="#settings?s=community"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4zM4 7l8 6 8-6"/></svg>Contact us &amp; investors</a>
  <a href="https://github.com/vigiltech01/vigil#readme" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2zm0 0a2 2 0 0 1 2-2h12"/></svg>Documentation</a>
  <a href="/logout" id="logout-link"><svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg>Sign out</a>
</div>
<div class="shell">
  <header class="topbar">
    <button class="icon-btn menu" id="menu" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="ptitle"><h1 id="pg-title">Vigil</h1><p id="pg-desc"></p></div>
    <div class="controls" id="filters">
      <span class="status-pill" id="status"><span class="dot"></span><span id="live-text">Connecting…</span></span>
      <div class="seg" id="ranges">
        <button data-r="1h">1H</button><button data-r="6h">6H</button><button data-r="24h">24H</button>
        <button data-r="7d">7D</button><button data-r="30d">30D</button><button data-r="custom" title="Custom range">···</button>
      </div>
      <span id="custom" hidden>
        <input type="datetime-local" id="c-from"> → <input type="datetime-local" id="c-to">
        <button id="c-apply">Apply</button>
      </span>
      <div class="seg small" id="tzs" title="Time zone for all timestamps"><button data-tz="local">Local</button><button data-tz="utc">UTC</button></div>
      <label class="switch" title="Refresh this page every 30 seconds"><input type="checkbox" id="auto"><span></span>Live</label>
      <button class="icon-btn" id="refresh" title="Refresh now"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></button>
      <span id="rangeinfo" class="updated"></span>
    </div>
  </header>
  <main id="main"></main>
</div>
<div id="modal" hidden><div class="box"><header><b id="m-title"></b><button id="m-close">Close</button></header><div id="m-body"></div></div></div>
<div id="toasts"></div>

<script src="/static/community.js"></script>
<script src="/static/security.js"></script>
<script src="/static/graph3d.js"></script>
<script src="/static/inv.js"></script>
</body>
</html>
