        set srcintf "wan1"
        set dstintf "dmz"
        set action accept
        set srcaddr "all"
        set dstaddr "mail-vip"
        set schedule "always"
        set service "SMTP"
        set utm-status enable
        set application-list "mail-inbound-strict"
        set logtraffic all
    next
    edit 3
        set name "mail-clients-imaps"
        set srcintf "wan1"
        set dstintf "dmz"
        set action accept
        set srcaddr "mail-client-countries"
        set dstaddr "mail-vip"
        set schedule "always"
        set service "mail-client-services"
        set utm-status enable
