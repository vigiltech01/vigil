    next
    edit "jump-host"
        set subnet 10.20.30.40 255.255.255.255
    next
    edit "geo-US"
        set type geography
        set country "US"
    next
    edit "geo-GB"
        set type geography
        set country "GB"
    next
    edit "geo-CA"
        set type geography
        set country "CA"
    next
    edit "geo-DE"
        set type geography
        set country "DE"
    next
    edit "geo-KP"
        set type geography
        set country "KP"
    next
    edit "geo-IR"
        set type geography
        set country "IR"
    next
end
config firewall addrgrp
    edit "partners"
        set member "partner-1" "partner-2"
    next
    edit "mail-client-countries"
        set member "geo-US" "geo-GB" "geo-CA" "geo-DE"
    next
    edit "high-risk-countries"
        set member "geo-KP" "geo-IR"
    next
end
config firewall service custom
    edit "HTTP"
        set tcp-portrange 80
    next
    edit "HTTPS"
        set tcp-portrange 443
    next
    edit "SMTP"
        set tcp-portrange 25
    next
    edit "SMTPS"
        set tcp-portrange 465
    next
    edit "SUBMISSION"
        set tcp-portrange 587
    next
    edit "IMAPS"
        set tcp-portrange 993
    next
    edit "SSH"
        set tcp-portrange 22
    next
    edit "RDP"
        set tcp-portrange 3389
    next
    edit "FGT-ADMIN"
        set tcp-portrange 8443
    next
    edit "ALL"
        set protocol IP
    next
end
config firewall service group
    edit "web-services"
        set member "HTTP" "HTTPS"
    next
    edit "mail-client-services"
        set member "IMAPS" "SMTPS" "SUBMISSION"
    next
end
config firewall vip
    edit "web-vip"
        set extip 203.0.113.10
        set mappedip "10.20.30.10"
        set extintf "wan1"
    next
    edit "mail-vip"
        set extip 203.0.113.20
        set mappedip "10.20.30.20"
        set extintf "wan1"
    next
    edit "sftp-vip"
        set extip 203.0.113.30
        set mappedip "10.20.30.30"
