        set portforward enable
        set extport 22
        set mappedport 22
    next
    edit "rdp-vip"
        set extip 203.0.113.40
        set mappedip "10.20.30.40"
        set extintf "wan1"
        set portforward enable
        set extport 3389
        set mappedport 3389
    next
end
config application list
    edit "default"
    next
    edit "mail-inbound-strict"
        set other-application-action block
    next
    edit "mail-clients-strict"
        set other-application-action block
    next
    edit "outbound-default"
    next
end
config ips sensor
