        set dstaddr "all"
        set action accept
        set service "FGT-ADMIN"
        set schedule "always"
    next
    edit 2
        set intf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set service "FGT-ADMIN"
        set schedule "always"
    next
end
config vpn ssl settings
