#config-version=FGVM64-7.04-FW-build2662-240514:opmode=0:vdom=0:user=admin
#conf_file_ver=20260115000000
#buildno=2662
#global_vdom=1
# Fictional demo configuration shipped with Vigil. All public addresses are RFC 5737 documentation ranges.
config system global
    set admin-sport 8443
    set admin-ssh-port 22
    set hostname "FGT-DEMO"
    set timezone "Etc/UTC"
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set password ENC SH2demoNotARealHashAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    next
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 203.0.113.2 255.255.255.0
        set allowaccess ping https
        set role wan
        set alias "internet"
    next
    edit "internal"
        set vdom "root"
        set ip 10.20.10.1 255.255.255.0
        set allowaccess ping https ssh
        set role lan
        set alias "office-lan"
    next
    edit "dmz"
        set vdom "root"
        set ip 10.20.30.1 255.255.255.0
        set allowaccess ping
        set role dmz
        set alias "servers"
    next
end
config vpn certificate local
    edit "demo-server-cert"
        set password ENC demoNotRealAAAAAAAAAA==
        set private-key "-----BEGIN ENCRYPTED PRIVATE KEY-----
MIIDEMOKEYNOTREALAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
-----END ENCRYPTED PRIVATE KEY-----"
    next
end
config firewall address
    edit "all"
    next
    edit "office-lan"
        set subnet 10.20.10.0 255.255.255.0
    next
    edit "admins-home"
        set subnet 192.0.2.201 255.255.255.255
    next
    edit "partner-1"
        set subnet 192.0.2.210 255.255.255.255
    next
    edit "partner-2"
        set subnet 192.0.2.211 255.255.255.255
    next
    edit "web-server"
        set subnet 10.20.30.10 255.255.255.255
    next
    edit "mail-server"
        set subnet 10.20.30.20 255.255.255.255
    next
    edit "sftp-server"
