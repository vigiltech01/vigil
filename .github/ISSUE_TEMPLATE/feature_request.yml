name: Feature request
description: An idea to make Vigil more useful
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What question do you want Vigil to answer?
      description: Describe the problem or situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
