name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -W ignore::DeprecationWarning
      - name: Installer syntax and dry run
        run: bash -n install.sh && ./install.sh --dry-run --yes --scan-dir "$RUNNER_TEMP"

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vigil:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (demo mode)
        run: |
          docker run -d --name vigil -p 8080:8080 -e VIGIL_DEMO=1 -e VIGIL_DEMO_HISTORY_HOURS=2 \
            -e VIGIL_ADMIN_USER=admin -e VIGIL_ADMIN_PASSWORD=ci-smoke-password vigil:ci
          for i in $(seq 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' vigil)" = healthy ] && break; sleep 3
          done
          docker inspect -f '{{.State.Health.Status}}' vigil | grep -q healthy
          sleep 40
          A=admin:ci-smoke-password
          for p in /api/meta '/api/overview?preset=24h' '/api/security?preset=24h' /api/graph3d/live /api/settings /api/health \
                   '/api/inv/search?q=port+3389'; do
            code=$(curl -s -o /tmp/r -w '%{http_code}' -u "$A" "http://localhost:8080$p")
            echo "$code $p"; [ "$code" = 200 ] || { cat /tmp/r; exit 1; }
          done
          curl -s -u "$A" http://localhost:8080/api/meta | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['last_event_ts'] > 0, d"
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/meta)" = 401 ]
          docker logs vigil 2>&1 | tail -20
          ! docker logs vigil 2>&1 | grep -q Traceback

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Publish multi-arch image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
